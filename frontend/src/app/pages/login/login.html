<section class="auth-screen">
  <form class="auth-card" novalidate (ngSubmit)="submit()">
    <div class="brand"><span class="mark">N</span><strong>Neiver Labs</strong></div>
    <p class="lede">Acceso privado para las empresas cliente y para el equipo de Neiver Labs.</p>
    <div class="stack">
      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput type="email" autocomplete="username" [formControl]="email">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Clave</mat-label>
        <input matInput type="password" autocomplete="current-password" [formControl]="password">
      </mat-form-field>
    </div>
    @if (error()) { <p class="alert" role="alert">{{ error() }}</p> }
    <div class="actions">
      <button mat-flat-button type="submit" [disabled]="submitting()">Entrar</button>
    </div>
  </form>
</section>

<section class="auth-screen">
  <form class="auth-card" novalidate (ngSubmit)="submit()">
    <div class="brand"><span class="mark">N</span><strong>Neiver Labs</strong></div>
    <h1>Cambia la clave</h1>
    <p class="lede">La clave temporal solo sirve para este primer acceso. La nueva debe tener al menos 12 caracteres, una letra y un número.</p>
    <div class="stack">
      <mat-form-field appearance="outline">
        <mat-label>Clave actual</mat-label>
        <input matInput type="password" autocomplete="current-password" [formControl]="currentPassword">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Clave nueva</mat-label>
        <input matInput type="password" autocomplete="new-password" [formControl]="newPassword">
      </mat-form-field>
    </div>
    @if (error()) { <p class="alert" role="alert">{{ error() }}</p> }
    <div class="actions">
      <button mat-flat-button type="submit" [disabled]="submitting()">Guardar clave</button>
    </div>
  </form>
</section>
